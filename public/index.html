<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROM TEXT TO FEELING | AI 감성 분석 서비스</title>
    <meta name="description" content="사용자가 입력한 문장을 AI로 분석해 감성을 직관적으로 보여주는 웹 서비스">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">SENTIMENT.AI</div>
            <nav class="nav">
                <span class="status-dot"></span>
                <span class="status-text">AI 시스템 가동 중</span>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="container">
                <h1 id="main-title">FROM TEXT TO FEELING</h1>
                <p class="subtitle">당신의 문장 속에 담긴 감성을 AI가 정교하게 분석합니다.</p>
            </div>
        </section>

        <section class="content-section">
            <div class="container">
                <div class="input-panel card">
                    <textarea id="text-input" placeholder="분석하고 싶은 문장을 입력하세요 (최대 1000자)..." maxlength="1000"></textarea>
                    <div class="actions">
                        <button id="analyze-btn" class="btn btn-primary">분석하기</button>
                    </div>
                </div>

                <div id="loading-area" class="loading-area hidden">
                    <div class="spinner"></div>
                    <p>AI가 감성을 분석하고 있습니다...</p>
                </div>

                <div id="result-area" class="result-area hidden">
                    <div class="result-card card">
                        <div class="result-header">
                            <span class="badge" id="sentiment-badge">긍정</span>
                            <h2 id="sentiment-text">긍정적인 분위기가 느껴집니다.</h2>
                        </div>
                        <div class="confidence-container">
                            <div class="confidence-label">분석 신뢰도</div>
                            <div class="progress-bar">
                                <div id="confidence-progress" class="progress-fill" style="width: 0%"></div>
                            </div>
                            <span id="confidence-value">0%</span>
                        </div>
                        <div class="reason-container">
                            <h3>분석 근거</h3>
                            <p id="sentiment-reason">문장에 긍정적인 표현이 다수 포함되어 있습니다.</p>
                        </div>
                    </div>
                </div>

                <div id="error-area" class="error-area hidden">
                    <div class="error-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        <p id="error-message">오류가 발생했습니다. 다시 시도해주세요.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 SENTIMENT.AI. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
